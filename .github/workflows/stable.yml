name: Track stable Zed releases
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
  pull_request:
permissions:
  contents: read
concurrency:
  group: stable-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.lookup.outputs.tag }}
      build: ${{ steps.lookup.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: lookup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            tag=$(jq -r .tag upstream.json)
          else
            tag=$(gh api repos/zed-industries/zed/releases/latest --jq .tag_name)
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
  windows:
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      CMAKE_GENERATOR: Ninja
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply the patch to the release
        shell: pwsh
        env:
          UPSTREAM_TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config --global core.longpaths true
          ./build.ps1 -Tag $env:UPSTREAM_TAG -PrepareOnly
      - name: Install the Windows installer compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          curl.exe -fLsS --retry 3 -o $setup 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe'
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $setup).Hash -ine '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Inno Setup download failed verification' }
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',("/DIR=`"$dir`"") -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0 -or !(Test-Path "$dir\ISCC.exe")) { throw 'Inno Setup installation failed' }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/zed-${{ needs.version.outputs.tag }} -> ../target
          shared-key: windows-stable
      - name: Build and test the upstream release
        shell: pwsh
        env:
          UPSTREAM_TAG: ${{ needs.version.outputs.tag }}
        run: ./build.ps1 -Tag $env:UPSTREAM_TAG -ReleaseRepository $env:GITHUB_REPOSITORY -Iscc "$env:RUNNER_TEMP\inno\ISCC.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [version, windows]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish the tested Windows installer and its source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c ./*.sha256
          gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ZEDP-RTL ${TAG#v}" --notes "Windows x64 build based on upstream Zed $TAG."
